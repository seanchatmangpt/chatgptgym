[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatgptgym"
version = "26.8.12"
description = "GymAct-compatible bounded digital twin of a sanitized ChatGPT cloud capability surface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymact @ git+https://github.com/seanchatmangpt/gymact.git@5a40c8f402aeb14699e216e17b2ef7aae9f0bc8f",
]

[project.optional-dependencies]
dev = ["pytest>=9", "rdflib>=7.5"]

[project.entry-points."gymact.providers"]
chatgpt-cloud = "chatgptgym.provider:ChatGPTCloudProvider"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chatgptgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
